name: GitHub Actions Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
    branches:
      - master
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:
    inputs:
      release:
        description: "Create an official fork release (master only)"
        type: choice
        required: false
        default: 'false'
        options:
          - 'true'
          - 'false'
      version_increment:
        description: "Default semantic version release type"
        type: choice
        required: false
        default: 'minor'
        options:
          - 'major'
          - 'minor'
          - 'patch'

env:
  VERINC: ${{ github.event.inputs.version_increment || 'patch' }}

# Build jobs only read repository contents; publishing grants write access separately.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@main

    - name: Auto Increment Version
      uses: MCKanpolat/auto-semver-action@1.0.12
      id: versioning
      with:
        releaseType: ${{ env.VERINC }}
        incrementPerCommit: false
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure build
      run: ./premake5 vs2026 --with-version=${{ steps.versioning.outputs.version }}

    # Every shader compiled again: the job fails when a committed compiled shader doesn't match its sources
    - name: Compile shaders
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/compileshaders.ps1 -Force -Verify

    - name: Build
      run: |
        msbuild -m build/GTAIV.EFLC.FusionFix.slnx /property:Configuration=Release /property:Platform=Win32

    - name: Download Ultimate ASI Loader x86
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "ThirteenAG/Ultimate-ASI-Loader"
        tag: "Win32-latest"
        fileName: "dinput8-Win32.zip"

    # Fork packages intentionally omit the private FusionFixHub download.
    # release.bat supports this in CI without HUB_RELEASE_TOKEN.
    - name: Download Legacy Package
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "GTAmodding/XLivelessAddon"
        tag: "latest"
        fileName: "XLivelessAddon.zip"

    - name: Unpack dependencies
      shell: cmd
      run: |
          7z x dinput8-Win32.zip -odata/ -y
          del dinput8-Win32.zip
          del data\dinput8-Win32.SHA512

    - name: Pack binaries
      run: |
        ./release.bat
      env:
        CODE_SIGNING_PFX: ${{ github.repository == 'MagicAl6244225/GTAIV.EFLC.FusionFix' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release == 'true')) && secrets.CODE_SIGNING_PFX || '' }}
        CODE_SIGNING_PASSWORD: ${{ github.repository == 'MagicAl6244225/GTAIV.EFLC.FusionFix' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release == 'true')) && secrets.CODE_SIGNING_PASSWORD || '' }}

    - name: Pack Legacy
      shell: cmd
      run: |
        7z e XLivelessAddon.zip plugins/XLivelessAddon.asi -y
        mkdir legacy
        copy data\dinput8.dll legacy\xlive.dll
        mkdir legacy\plugins
        copy XLivelessAddon.asi legacy\plugins\
        cd legacy
        7z a -tzip ..\GTAIV.EFLC.FusionFixLegacyAddon.zip *
        cd ..
        rmdir /s /q legacy
        del XLivelessAddon.asi

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        if-no-files-found: error
        retention-days: 14
        path: GTAIV.EFLC.FusionFix.zip

    - name: Upload artifact (asi)
      uses: actions/upload-artifact@v7
      with:
        archive: false
        if-no-files-found: error
        retention-days: 14
        path: data/plugins/GTAIV.EFLC.FusionFix.asi

    - name: Upload Legacy Addon
      uses: actions/upload-artifact@v7
      with:
        archive: false
        if-no-files-found: error
        retention-days: 14
        path: GTAIV.EFLC.FusionFixLegacyAddon.zip

  publish:
    needs: build
    if: >-
      github.repository == 'MagicAl6244225/GTAIV.EFLC.FusionFix' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize release mutations without cancelling an upload already in progress.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}

    steps:
    - name: Check development build is still current
      id: current
      if: github.event_name == 'push'
      shell: bash
      run: |
        head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')
        if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "Skipping superseded development build $GITHUB_SHA; master is $head_sha."
        fi

    - name: Download build artifacts
      if: github.event_name == 'workflow_dispatch' || steps.current.outputs.publish == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: GTAIV.EFLC.FusionFix*
        merge-multiple: true
        skip-decompress: true
        path: release-assets

    - name: Publish release
      if: github.event_name == 'workflow_dispatch' || steps.current.outputs.publish == 'true'
      shell: bash
      run: |
        assets=(
          release-assets/GTAIV.EFLC.FusionFix.zip
          release-assets/GTAIV.EFLC.FusionFix.asi
          release-assets/GTAIV.EFLC.FusionFixLegacyAddon.zip
        )
        for asset in "${assets[@]}"; do
          test -s "$asset"
        done

        cat > release-notes.md <<EOF
        Build of the MagicAl6244225 fork.
        Source commit: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA)
        Build: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID
        [README]($GITHUB_SERVER_URL/$GH_REPO#readme)

        This package does not include FusionFixHub, DXVK, or the retired installers.
        EOF

        if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          # Check again after downloading, before moving the rolling tag.
          head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded development build $GITHUB_SHA."
            exit 0
          fi

          tag=development
          echo "This is a rolling development build; its assets are replaced on successful master pushes." >> release-notes.md
          ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[] | select(.ref == "refs/tags/development") | .ref')
          if [[ -n "$ref" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi

          release_id=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "development") | .id')
          if [[ -n "$release_id" ]]; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "Development build (MagicAl6244225)" --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --title "Development build (MagicAl6244225)" --notes-file release-notes.md --prerelease --latest=false
          fi
        else
          # Manual releases are immutable: creating an existing release fails.
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "v$RELEASE_VERSION" "${assets[@]}" --target "$GITHUB_SHA" --title "GTAIV.EFLC.FusionFix v$RELEASE_VERSION (MagicAl6244225)" --notes-file release-notes.md --latest
        fi
